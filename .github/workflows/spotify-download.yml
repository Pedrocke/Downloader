name: Download OpenVPN Connect DMG

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
  # Optional: run daily at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'

jobs:
  download:
    runs-on: macos-latest   # or ubuntu-latest – both can download the file
    steps:
      - name: Download OpenVPN Connect DMG
        run: |
          curl -L -o openvpn-connect-v3-macos.dmg \
            "https://openvpn.net/downloads/openvpn-connect-v3-macos.dmg"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-connect-dmg
          path: openvpn-connect-v3-macos.dmg
          retention-days: 5   # adjust as needed
