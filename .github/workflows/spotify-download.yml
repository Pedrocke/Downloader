name: Download & Smart Split Any File

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct download URL of the file'
        required: true
        type: string
      split_threshold_mb:
        description: 'Split files larger than this MB into parts'
        required: false
        default: '100'
        type: string
  # Optional: remove schedule if you only want manual runs with custom URLs
  # schedule:
  #   - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  download-split-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directories
        run: mkdir -p downloads/temp

      - name: Download file from input URL
        run: |
          URL="${{ github.event.inputs.download_url }}"
          # Strip query parameters to get a clean filename
          CLEAN_URL="${URL%%\?*}"
          FILENAME=$(basename "$CLEAN_URL")
          echo "Downloading: $FILENAME"
          curl -L -o "downloads/temp/$FILENAME" "$URL"

      - name: ✂️ Smart Split Large Files
        run: |
          THRESHOLD_MB="${{ github.event.inputs.split_threshold_mb || 100 }}"
          THRESHOLD_BYTES=$((THRESHOLD_MB * 1024 * 1024))
          
          process_file() {
            local file="$1"
            local size=$(stat -c%s "$file")
            local basename=$(basename "$file")
            local size_mb=$((size / 1024 / 1024))
            
            if [[ $THRESHOLD_BYTES -gt 0 && $size -gt $THRESHOLD_BYTES ]]; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "✂️ Splitting $basename (${size_mb}MB)"
              echo "   Parts size: ${THRESHOLD_MB}MB each"
              
              cd ./downloads
              # Create a split ZIP archive from the file
              zip -r -s "${THRESHOLD_MB}m" "${basename}.zip" "temp/${basename}"
              cd ..
              
              PARTS_COUNT=$(ls ./downloads/${basename}.z* 2>/dev/null | wc -l)
              echo "✅ Created $PARTS_COUNT parts"
              
              # Remove original file from temp
              rm "$file"
            else
              if [[ $THRESHOLD_BYTES -eq 0 ]]; then
                echo "📁 $basename (${size_mb}MB) — split disabled"
              else
                echo "📁 $basename (${size_mb}MB) — under threshold"
              fi
              mv "$file" "./downloads/"
            fi
          }
          
          export -f process_file
          export THRESHOLD_BYTES THRESHOLD_MB
          
          find ./downloads/temp -type f -exec bash -c 'process_file "$0"' {} \;
          rm -rf ./downloads/temp
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📂 Final files in ./downloads/:"
          ls -lh ./downloads/ 2>/dev/null | tail -n +2 | awk '{print "  • " $NF " (" $5 ")"}'
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📤 Commit and Push to Repository (batched)
    run: |
      BRANCH="${GITHUB_REF_NAME}"
      
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"
      
      # Stage everything initially to see what's new
      git add ./downloads/
      
      if git diff --staged --quiet; then
        echo "ℹ️ No changes to commit"
        exit 0
      fi
      
      # Get list of staged files
      mapfile -t STAGED_FILES < <(git diff --staged --name-only)
      TOTAL_FILES=${#STAGED_FILES[@]}
      echo "📦 Found $TOTAL_FILES file(s) to upload"
      
      # Unstage all to batch them
      git reset HEAD ./downloads/
      
      BATCH_SIZE=5
      for (( i=0; i<TOTAL_FILES; i+=BATCH_SIZE )); do
        BATCH_NUM=$((i / BATCH_SIZE + 1))
        END=$((i + BATCH_SIZE))
        [[ $END -gt $TOTAL_FILES ]] && END=$TOTAL_FILES
        
        echo "🚀 Uploading batch $BATCH_NUM [$((i+1))–${END} of $TOTAL_FILES]"
        
        # Stage files for this batch – explicit variable with space
        for (( j=i; j<END; j++ )); do
          file="${STAGED_FILES[$j]}"
          git add "$file"
        done
        
        git commit -m "chore: add downloaded file batch $BATCH_NUM [skip ci]"
        git pull --rebase origin "$BRANCH" || true
        git push origin "$BRANCH"
      done
