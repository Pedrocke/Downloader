name: Download Spotify Track

on:
  workflow_dispatch:
    inputs:
      track_url:
        description: 'Spotify track URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download track
        run: python download.py "${{ inputs.track_url }}"

      - name: Commit & push MP3 file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add downloaded track"
          file_pattern: "downloads/*.mp3"
