name: Download and Split VS Code Extension

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Extension Name'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-extension:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install offvsix
        run: |
          pip install git+https://github.com/gni/offvsix.git

      - name: Download extension
        run: |
          echo "Downloading extension: ${{ inputs.name }}"
          offvsix "${{ inputs.name }}"
          echo "Download complete"

      - name: Check size and split if needed
        run: |
          cd extensions
          
          # Find the downloaded vsix file
          FILE=$(ls *.vsix)
          
          if [ -z "$FILE" ]; then
            echo "Error: No .vsix file found"
            exit 1
          fi
          
          echo "Found file: $FILE"
          
          # Get file size in MB
          SIZE_MB=$(du -m "$FILE" | cut -f1)
          echo "Extension size: ${SIZE_MB}MB"
          
          if [ $SIZE_MB -gt 100 ]; then
            echo "Extension exceeds 100MB, splitting into parts..."
            BASENAME="${FILE%.vsix}"
            zip -r -s 100m "${BASENAME}-split.zip" "$FILE"
            
            # Remove original file to save space
            rm "$FILE"
            
            echo "Split complete. Parts created:"
            ls -lh
          else
            echo "Extension is under 100MB, no splitting needed"
          fi

      - name: Commit and push extensions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add extensions/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add extension: ${{ inputs.name }}"
            git push
          fi
