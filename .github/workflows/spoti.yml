name: Free Spotify Downloader (No Premium)

on:
  workflow_dispatch:
    inputs:
      spotify_url:
        description: 'Paste your Spotify Track URL here'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg (required by yt-dlp)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install metadata scraper
        run: npm install spotify-url-info

      - name: Install audio downloader
        run: pip install yt-dlp

      - name: Get Track Info and Download
        run: node get-and-download.js "${{ inputs.spotify_url }}"

      - name: Commit MP3 file to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add downloaded Spotify track"
          file_pattern: "downloads/*.mp3"
